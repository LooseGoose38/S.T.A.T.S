<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Game Library</title>
        <style>
            body{
                font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                color: #ffffff;
                margin: 0;
                padding: 20px;
                /* background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); */
                /* background-attachment: fixed; keep background still */
                /* min-height: 100vh; */
                background-color: #0f172a;
                min-height: 100vh;
                overflow-x: hidden;
            }
            body::before, body::after{
                content: '';
                position: fixed;
                border-radius: 50%;
                z-index: -1;
            }
            body::before{
                top: 5%; left: 15%; width: 400px; height: 400px;
                background: #3b82f6; filter: blur(60px); opacity: 0.3;
            }

            body::after{
                bottom: 10%; right: 15%; width: 500px; height: 500px;
                background: #8b5cf6; filter: blur(60px); opacity: 0.2;
            }



            h1{
                text-align: center;
                margin-bottom: 40px;
                font-weight: 600;
                letter-spacing: 1px;
            }

            .platform-header {
                max-width: 1200px;
                margin: 40px auto 20px auto;
                border-bottom: 2px solid rgba(255, 255, 255, 0.1);
                padding-bottom: 10px;
            }

            .psn-header { color: #0070d1; text-shadow: 0 0 10px rgba(0, 113, 209, 0.5);}
            .xbox-header { color: #107c10; text-shadow: 0 0 10px rgba(16, 124, 16, 0.5);}

            .game-grid{
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 30px;
                max-width: 1200px;
                margin: 0 auto;
            }
            .game-card{
                background: transparent;
                text-align: left;
                cursor: pointer;
                display: flex;
                flex-direction: column;
            }

            .game-card img{
                width: 100%;
                height: auto;
                aspect-ratio: 1/1;
                object-fit: contain;
                border-radius: 12px;
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
                transition: transform 0.3s ease, box-shadow 0.3s ease;
            }

            .game-card:hover img{ 
                transform:translateY(-8px);
                box-shadow: 0 15px 30px rgba(0, 0, 0, 0.7);
            }

            .game-title{
                font-size: 1.15em;
                font-weight: bold;
                margin: 15px 0 5px 0;
                white-space: wrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .game-progress{
                font-size: 0.9em;
                color: #94a3b8;
            }
        </style>
    </head>

    <body>
        <script>
            const token = localStorage.getItem('statsToken');
            if(!token) window.location.href = 'login.html';
        </script>

        <div style="text-align: right; max-width: 1200px; margin: 0 auto; padding-top: 10px;">
            <span id="welcome-message" style="color: 94a3b8; margin-right: 15px;"></span>
            <button onclick="logout()" style="background: rgba(248, 113, 113, 0.2); border: 1px solid #f87171; padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: 0.3s;">
                Log Out
            </button>
        </div>

        <h1>S.T.A.T.S</h1>

        <h2 class="platform-header psn-header">PlayStation Library</h2>
        <div id="psn-grid" class="game-grid"></div>

        <!-- <h2 class="platform-header xbox-header">Xbox Library</h2> -->
        <!-- <div id="xbox-grid" class="game-grid"></div> -->

        <script>
            //display the logged-in user's name
            const savedUsername = localStorage.getItem('statsUsername');
            if(savedUsername){
                document.getElementById('welcome-message').innerText = `Logged in as: ${savedUsername}`;
            }

            //logout function
            function logout(){
                localStorage.removeItem('statsToken');
                localStorage.removeItem('statsUsername');
                window.location.href = 'login.html'
            }
            const API_URL = '/api/games';

            function renderGrid(gameArray, containerId){
                const grid = document.getElementById(containerId);

                gameArray.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'game-card';

                    card.onclick = () => {
                        window.location.href = `game.html?id=${game._id}`;
                    };

                    const unlockWord = game.ecosystem ===  'PlayStation' ? 'Trophies' : 'Achievements';

                    card.innerHTML = `
                    <img src="${game.boxArtUrl}" alt="${game.title} Box Art">
                    <div class="game-title">${game.title}</div>
                    <div class="game-progress">
                        ${game.progress.unlockedCount} / ${game.progress.totalCount} ${unlockWord} (${game.progress.completionPercentage}%)
                    </div>
                `;
                grid.appendChild(card);
                });
            }



            async function loadGames(){
                try{
                    const response = await fetch(API_URL);
                    const games = await response.json();

                    const psnGames = games.filter(game => game.ecosystem === 'PlayStation');
                    // const xboxGames = games.filter(game => game.ecosystem === 'Xbox');

                    renderGrid(psnGames, 'psn-grid');
                    //renderGrid(xboxGames, 'xbox-grid');

                } catch (error) { 
                    console.error('Error fetching games:', error);
                document.body.innerHTML += '<p style="text-align:center;">Error loading library. Is the server running?</p>';
                }
            }

            loadGames();
        </script>
    </body>
</html>
