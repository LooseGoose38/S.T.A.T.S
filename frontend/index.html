<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Game Library</title>
        <style>
            @font-face {
                font-family: 'Nedian';
                src: url(fonts/Nedian\ Medium.otf) format('opentype');
                font-weight: normal;
                font-style: normal;
            }
            @font-face {
                font-family: 'Playstation';
                src: url(fonts/zrnic\ rg.otf) format('opentype');
                font-weight: normal;
                font-style: normal;
            }
            body{
                font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                color: #ffffff;
                margin: 0;
                padding: 20px;
                /* background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); */
                /* background-attachment: fixed; keep background still */
                /* min-height: 100vh; */
                background-color: #0f172a;
                min-height: 100vh;
                overflow-x: hidden;
            }
            body::before, body::after{
                content: '';
                position: fixed;
                border-radius: 50%;
                z-index: -1;
            }
            body::before{
                top: 5%; left: 15%; width: 400px; height: 400px;
                background: #3b82f6; filter: blur(60px); opacity: 0.3;
            }

            body::after{
                bottom: 10%; right: 15%; width: 500px; height: 500px;
                background: #8b5cf6; filter: blur(60px); opacity: 0.2;
            }


            .top-nav{
                display: flex;
                justify-content: flex-end;
                align-items: center;
                max-width: 1200px;
                margin: 0 auto;
                padding-top: 10px;
                gap: 20px;
                flex-wrap: wrap;
            }

            #welcome-message { color: #94a3b8; }
            .nav-btn {
                padding: 8px 16px;
                border-radius: 8px;
                cursor: pointer;
                transition: 0.3s;
                font-weight: 600;
            }

            .sync-btn-style{
                background: rgba(59, 139, 246, 0.2);
                border: 1px solid #3b82f6;
                color: #3b82f6;
            }

            .logout-btn-style{
                background: rgba(248, 113, 113, 0.2);
                border: 1px solid #f87171;
                color: #f87171;
            }

            h1{
                font-family: 'Nedian', sans-serif;
                text-align: center;
                margin-bottom: 40px;
                font-size: 3em;
                font-weight: normal;
                letter-spacing: 3px;
                text-shadow: 0 0 15px rgba(59, 139, 246, 0.6);
                
            }

            .platform-header {
                max-width: 1200px;
                margin: 40px auto 20px auto;
                border-bottom: 2px solid rgba(255, 255, 255, 0.1);
                padding-bottom: 10px;
            }

            .psn-header { 
                font-family: 'Nedian';
                color: #0070d1; 
                text-shadow: 0 0 10px rgba(0, 113, 209, 0.5);
            }

            .xbox-header { color: #107c10; text-shadow: 0 0 10px rgba(16, 124, 16, 0.5);}

            .game-grid{
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 30px;
                max-width: 1200px;
                margin: 0 auto;
            }
            .game-card{
                background: transparent;
                text-align: left;
                cursor: pointer;
                display: flex;
                flex-direction: column;
            }

            .game-card img{
                width: 100%;
                height: auto;
                aspect-ratio: 1/1;
                object-fit: contain;
                border-radius: 12px;
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
                transition: transform 0.3s ease, box-shadow 0.3s ease;
            }

            .game-card:hover img{ 
                transform:translateY(-8px);
                box-shadow: 0 15px 30px rgba(0, 0, 0, 0.7);
            }

            .game-title{
                font-size: 1.15em;
                font-weight: bold;
                margin: 15px 0 5px 0;
                white-space: wrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .game-progress{
                font-size: 0.9em;
                color: #94a3b8;
            }
            @media (max-width: 600px){
                .top-nav{
                    justify-content: center;
                    flex-direction: column;
                    gap: 10px;
                    margin-bottom: 20px ;
                }
                .nav-actions{
                    display: flex;
                    gap: 10px;
                    width: 100%;
                }

                .nav-btn{
                    flex: 1;
                }
                .game-grid{
                    grid-template-columns: repeat(2, 1fr);
                    gap: 15px;
                }

                .game-title{
                    font-size: 1em;
                }
            }
                
                .search-container {
                    display: flex;
                    justify-content: center;
                    width: 100%;
                    margin-bottom: 30px;
                    padding: 0 20px;
                    box-sizing: border-box;
                }

                #search-bar {
                    width: 100%;
                    max-width: 600px;
                    padding: 14px 20px;
                    border-radius: 12px;
                    border: 1px solid rgba(255, 255, 255, 0.2);

                    background: rgba(255, 255, 255, 0.05);
                    backdrop-filter: blur(12px);
                    -webkit-backdrop-filter: blur(12px);

                    color: white;
                    font-size: 16px;
                    outline: none;
                    transition: border 0.3s, background 0.3s;
                    appearance: none;
                    -webkit-appearance: none;
                    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
                    box-sizing: border-box;
                }

                #search-bar::placeholder{
                    color: #94a3b8;
                }

                #search-bar:focus {
                    border: 1px solid #3b82f6;
                    background: rgba(255, 255, 255, 0.1);
                }

                /*--- Friends Modal Styles --- */
                .modal-overlay {
                    display: none;
                    position: fixed;
                    top: 0; left: 0; width: 100%; height: 100%;
                    background: rgba(0, 0, 0, 0.6);
                    backdrop-filter: blur(5px);
                    -webkit-backdrop-filter: blur(5px);
                    z-index: 1000;
                    justify-content: center;
                    align-items: center;
                }

                .modal-content {
                    background: rgba(30, 41, 59, 0.85);
                    backdrop-filter: blur(16px);
                    -webkit-backdrop-filter: blur(16px);
                    border: 1px solid rgba(255, 255, 255, 0.1);
                    border-radius: 16px;
                    padding: 25px;
                    width: 90%;
                    max-width: 400px;
                    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
                    position: relative;
                }
                
                .close-btn {
                    position: absolute;
                    top: 15px; right: 20px;
                    font-size: 1.5em;
                    cursor: pointer;
                    color: #94a3b8;
                    transition: color 0.2s;
                }

                .close-btn:hover {
                    color: white;
                }

                .friend-item {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    padding: 12px;
                    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                }

        </style>
    </head>

    <body>
        <script>
            const token = localStorage.getItem('statsToken');
            if(!token) window.location.href = 'login.html';
        </script>

        <div class="top-nav">
            <span id="welcome-message"></span>
            <div class="nav-actions">
                <button class="nav-btn sync-btn-style" onclick="toggleFriendsModal()" style="border-color: #a855f7; color: #a855f7; background: rgba(168, 85, 247, 0.2);">
                    Friends
                </button>
                <button id="sync-btn" class="nav-btn sync-btn-style" onclick="syncPlaystation()">Sync PlayStation Library</button>
                <button class="nav-btn logout-btn-style" onclick="logout()">Log Out</button>
            </div>
        </div>
        

        <h1>S.T.A.T.S</h1>

        <div class="search-container">
            <input type="text" id="search-bar" placeholder="Search your library..." oninput="filterGames()">
        </div>

        <h2 class="platform-header psn-header">PlayStation Library</h2>
        <div id="psn-grid" class="game-grid"></div>

        <!-- <h2 class="platform-header xbox-header">Xbox Library</h2> -->
        <!-- <div id="xbox-grid" class="game-grid"></div> -->

        <div id="friends-modal" class="modal-overlay">
            <div class="modal-content">
                <span class="close-btn" onclick="toggleFriendsModal()">x</span>
                <h2 style="margin-top: 0;">Friends List</h2>

                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <input type="text" id="friend-input" placeholder="Add by username..." style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.2); color: white; outline: none;">
                    <button class="nav-btn sync-btn-style" onclick="addFriend()">Add</button>
                </div>
                
                <div id="friends-list-container">
                    <p style="color: #94a3b8; text-align: center;">Loading friends...</p>
                </div>
            </div>
        </div>

        <script>
            //display the logged-in user's name
            const savedUsername = localStorage.getItem('statsUsername');
            if(savedUsername){
                document.getElementById('welcome-message').innerText = `Logged in as: ${savedUsername}`;
            }

            //logout function
            function logout(){
                localStorage.removeItem('statsToken');
                localStorage.removeItem('statsUsername');
                window.location.href = 'login.html';
            }
            const API_URL = '/api/games';
            let globalPsnGames = [];

            function renderGrid(gameArray, containerId){
                const grid = document.getElementById(containerId);
                grid.innerHTML = '';

                if(gameArray.length === 0) {
                    grid.innerHTML = '<p style="text-align:center; color: #94a3b8; grid-column: 1 / -1;">No games found.</p>';
                    return;
                }

                gameArray.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'game-card';

                    card.onclick = () => {
                        window.location.href = `game.html?id=${game._id}`;
                    };

                    const unlockWord = game.ecosystem ===  'PlayStation' ? 'Trophies' : 'Achievements';

                    card.innerHTML = `
                    <img src="${game.boxArtUrl}" alt="${game.title} Box Art">
                    <div class="game-title">${game.title}</div>
                    <div class="game-progress">
                        ${game.progress.unlockedCount} / ${game.progress.totalCount} ${unlockWord} (${game.progress.completionPercentage}%)
                    </div>
                `;
                grid.appendChild(card);
                });
            }


            async function loadGames(){
                try{
                    const token = localStorage.getItem('statsToken');

                    const response = await fetch(API_URL, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (!response.ok) {
                        throw new Error('Unauthorized or server error');
                    }

                    const games = await response.json();

                    globalPsnGames = games.filter(game => game.ecosystem === 'PlayStation');
                    // const xboxGames = games.filter(game => game.ecosystem === 'Xbox');

                    renderGrid(globalPsnGames, 'psn-grid');
                    //renderGrid(xboxGames, 'xbox-grid');

                } catch (error) { 
                    console.error('Error fetching games:', error);
                    document.getElementById('psn-grid').innerHTML = '<p style="text-align:center;">Error loading library. Please try logging in again.</p>';
                }
            }

            function filterGames() {
                const query = document.getElementById('search-bar').value.toLowerCase();

                const filteredGames = globalPsnGames.filter(game => {
                    return game.title.toLowerCase().includes(query);
                });
                
                renderGrid(filteredGames, 'psn-grid');
            }

            async function syncPlaystation() {
                const syncBtn = document.getElementById('sync-btn');
                const token = localStorage.getItem('statsToken');

                //visual feedback

                syncBtn.innerText = 'Syncing...';
                syncBtn.disabled = true;
                syncBtn.style.opacity = '0.5';

                try{
                    const res = await fetch('/api/sync/psn', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    const data = await res.json();

                    if(res.ok){
                        alert('Sync complete! Loading your games now.');
                        loadGames();
                    } else {
                        alert('Error syncing: ' + (data.error || data.message));
                    }
                } catch (err){
                    alert('Failed to connect to the server for syncing.');
                } finally {
                    syncBtn.innerText = 'Sync PlayStation';
                    syncBtn.disabled = false;
                    syncBtn.style.opacity = '1';
                }
            }

            function toggleFriendsModal() {
                const modal = document.getElementById('friends-modal');
                if(modal.style.display === 'flex') {
                    modal.style.display = 'none';
                } else {
                    modal.style.display = 'flex';
                    loadFriends();
                }
            }

            async function loadFriends() {
                const container = document.getElementById('friends-list-container');
                try{
                    const token = localStorage.getItem('statsToken');
                    const res = await fetch('/api/friends', { headers: { 'Authorization': `Bearer ${token}` } });
                    const friends = await res.json();

                    if(friends.length === 0){
                        container.innerHTML = '<p style="color: #94a3b8; text-align: center;"> No friends added yet.</p>';
                        return;
                    }

                    container.innerHTML = friends.map(friend => `
                        <div class="friend-item">
                            <div>
                                <strong>${friend.username}</strong>
                                <div style="font-size: 0.8em; color: #94a3b8;">PSN: ${friend.psnId}</div>
                            </div>
                            <button class="nav-btn sync-btn-style" style="padding: 6px 12px; font-size: 0.85em;" onclick="viewFriendLibrary('${friend._id}', '${friend.username}', '${friend.psnId}')">View Games</button>
                        </div>
                    `).join('');
                } catch (error) {
                    container.innerHTML = '<p style="color: #ef4444;">Error loading friends.</p>';
                }
            }

            async function addFriend() {
                const input = document.getElementById('friend-input');
                const username = input.value.trim();
                if(!username) return;

                try{
                    const token = localStorage.getItem('statsToken');
                    const res = await fetch('/api/friends/add', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
                        body: JSON.stringify({ friendUsername: username })
                    });

                    const data = await res.json();
                    if(res.ok) {
                        input.value = '';
                        loadFriends();
                    } else {
                        alert(data.message || 'Error adding friend');
                    }
                } catch (error)  {
                    alert('Server error.');
                }
            }

            function viewFriendLibrary(friendId, friendName, psnId) {
                window.location.href = `friend.html?id=${friendId}&username=${encodeURIComponent(friendName)}&psnId=${encodeURIComponent(psnId)}`;
            }


            loadGames();
        </script>
    </body>
</html>
