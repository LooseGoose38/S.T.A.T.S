<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", inital-scale="1.0">
        <title>S.T.A.T.S - Authentication</title>
        <style>
            body{
                background-color: #0f172a;
                color: #ffffff;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                overflow: hidden;
            }

            body::before, body::after {
                content: '';
                position: fixed;
                border-radius: 50%;
                z-index: -1;
            }

            body::before{
                top: 5%;
                left: 15%;
                width: 400px;
                height: 400px;
                background: #3b82f6;
                filter: blur(60px);
                opacity: 0.3;
            }
            body::after{
                bottom: 10%;
                right: 15%;
                width: 500px;
                height: 500px;
                background: #8b5cf6;
                filter: blur(60px);
                opacity: 0.2;
            }

            .auth-card{
                background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.02) 100%);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border: 1px solid rgba (255,255,255,0.1);
                border-radius: 20px;
                padding: 40px;
                width: 100%;
                max-width: 350px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
                text-align: center;
            }

            .auth-card h1 {
                margin-top: 0;
                font-size: 1.8em;
                margin-bottom: 20px;
            }

            input{
                width: 100%;
                padding: 12px;
                margin-bottom: 15px;
                border-radius: 8px;
                border: 1px solid rgba(255, 255, 255, 0.2);
                background: rgba(0, 0, 0, 0.2);
                color: white;
                box-sizing: border-box;
                outline: none;
                transition: border 0.3s;
            }

            input::placeholder{ color: #94a3b8}
            input:focus { border: 1px solid #3b82f6; }

            button {
                width: 100%;
                padding: 12px;
                border-radius: 8px;
                border: none;
                background: #3b82f6;
                color: white;
                font-weight: bold;
                font-size: 1em;
                cursor: pointer;
                margin-top: 10px;
                transition: 0.3s;
            }
            button:hover{ background: #2563eb; }

            .toggle-text { 
                margin-top: 20px;
                font-size: 0.9em;
                color: #94a3b8;
                cursor: pointer;
                transition: color 0.3s;
            }

            .toggle-text:hover { color: white; }

            .hidden { display: none; }
            #message { margin-top: 15px; font-size: 0.9em; }
        </style>
    </head>
    <body>
        <div class="auth-card">
            <h1 id="form-title">Create Account</h1>

            <form id="auth-form">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>

                <input type="text" id="psnId" placeholder="PSN ID (e.g. LooseGoose)" required>

                <button type="submit" id="submit-btn">Register</button>
            </form>

            <div class="toggle-text" id="toggle-mode">Already have an account? Sign In</div>
            <div id="message"></div>
        </div>

        <script>
            let isLoginMode = false;

            const formTitle = document.getElementById('form-title')
            const psnInput = document.getElementById('psnId');
            const submitBtn = document.getElementById('sumbit-btn');
            const toggleMode = document.getElementById('toggle-mode')
            const form = document.getElementById('auth-form')
            const messageDiv = document.getElementById('message');

            toggleMode.addEventListener('click', () => {
                isLoginMode = !isLoginMode;
                messageDiv.innerText = '';

                if(isLoginMode){
                    formTitle.innerText = 'Welcome Back';
                    psnInput.classList.add('hidden');
                    psnInput.removeAttribute('required');
                    submitBtn.innerText = 'Sign In';
                    toggleMode.innerText = "Don't have an account? Register"
                } else {
                    formTitle.innerText = 'Create Account';
                    psnInput.classList.remove('hidden');
                    psnInput.setAttribute('required', 'true');
                    submitBtn.innerText = 'Register';
                    toggleMode.innerText = 'Already have an account? Sign In';
                }
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                messageDiv.innerText = 'Processing...';
                messageDiv.style.color = '#94a3b8';

                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const psnId = document.getElementById('psnId').value;

                if(!isLoginMode){
                    try{
                        const res = await fetch('/api/auth/register', {
                            method: 'POST',
                            headers: { 'Content-Type' : 'application/json'},
                            body: JSON.stringify({ username, password, psnId })
                        });

                        const data = await res.json();

                        if(res.ok) {
                            messageDiv.style.color = '#4ade80';
                            messageDiv.innerText = 'Account created! You can now sign in.';
                            form.reset();
                            setTimeout(() => toggleMode.click(), 2000);
                        } else {
                            messageDiv.style.color = '#f87171';
                            messageDiv.innerText = data.message || 'Registration';
                        }
                    } catch (err) {
                        messageDiv.style.color = '#f87171';
                        messageDiv.innerText = 'Error connecting to the server.';
                    }
                } else {
                    messageDiv.style.color = '#fbd38d';
                    messageDiv.innerText = 'Login endpoint not built yet!';
                }
            });
        </script>
    </body>
</html>
